<!doctype html>
<html lang="en" class="dark scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ontogenetic Systems | Autonomous Digital Architecture & AI Engineering</title>
    <meta name="description" content="Ontogenetic Systems is a high-performance digital agency crafting autonomous AI systems, modern web platforms, and futuristic digital experiences." />
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
  </head>
  <body class="bg-canvas text-brand-text font-sans antialiased selection:bg-cyber-emerald selection:text-canvas overflow-x-hidden min-h-screen">
    <!-- Static Hidden HTML Form for Netlify Form Detection & Email Alerts in React -->
    <form name="agency-contact" netlify="true" netlify-honeypot="bot-field" hidden aria-hidden="true">
      <input type="hidden" name="form-name" value="agency-contact" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="service" />
      <input type="text" name="budget" />
      <textarea name="message"></textarea>
    </form>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
